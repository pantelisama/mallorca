services:
  agent:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      CORS_ORIGIN: ${CORS_ORIGIN:-https://pantelisama.github.io}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-pantelisama/mallorca}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GMAPS_IMAGE: ${GMAPS_IMAGE:-gosom/google-maps-scraper:latest}
    volumes:
      - gmaps-cache:/opt
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  gmaps-cache:
