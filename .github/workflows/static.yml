name: Validate and deploy Mallorca planner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate planner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate HTML structure and JS integrity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          const requiredHtml = ['id="map"', 'id="plan"', 'id="days"', 'id="filters"', 'app.js'];
          for (const x of requiredHtml) if (!html.includes(x)) throw new Error('Missing required HTML: ' + x);
          for (const x of ['function render()', 'function openSpot(', 'function openVillage(', 'function toggleRoute(', 'render();']) if (!js.includes(x)) throw new Error('Missing required JS: ' + x);
          if (/\\n/.test(js)) throw new Error('Literal \\n sequence found in app.js');
          if (/mallorca-agent|agent-modal|agent-add|MALLORCA_AGENT_URL/.test(html + js + css)) throw new Error('Removed AI/agent artifact found');
          for (const x of ['.spot-card', '.day-panel', '.photo-grid', '.route-pin']) if (!css.includes(x)) throw new Error('Missing required CSS: ' + x);
          console.log('Static integrity checks passed');
          NODE
      - name: Run Node tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
